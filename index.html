<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b86ee">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>일본어 내신 노트</title>
<meta name="robots" content="noindex,nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="일본어노트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Klee+One:wght@400;600&display=swap">
<style>
/* Layout: 앱 셸은 수능영어 노트의 하늘색 교복 테마 그대로, '릴스' 탭만 세로 스와이프 전체 화면(행마다 다른 하늘·벚꽃 그라데이션). 큰 글자는 교과서 손글씨체(Klee One). */
:root{
  --bg:#edf5ff; --card:#ffffff; --ink:#1d2747; --muted:#5f6b8a; --line:#d8e5f6;
  --sky1:#2b86ee; --sky2:#9ad0ff; --navy:#26335c; --red:#e0384f;
  --pink:#ff6f9a; --pink-soft:#ffe4ed; --hl:#ffd3e1; --mint:#14a378; --mint-soft:#dbf4ea;
  --blue:#2b86ee; --blue-soft:#e1efff; --coral:#e0384f; --coral-soft:#ffe6ea;
  --btn:#1d2747; --btn-ink:#ffffff; --glass:rgba(255,255,255,.82); --glass-ink:#1d2747;
  --reel-ink:#ffffff; --reel-dim:rgba(255,255,255,.78); --reel-glass:rgba(255,255,255,.16); --reel-line:rgba(255,255,255,.28); --reel-bg:#0b1430;
  --font-display:"Jua","Apple SD Gothic Neo",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --font-ja:"Klee One","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1530; --card:#16213f; --ink:#eef3ff; --muted:#9fb0d4; --line:#253358;
  --sky1:#18346c; --sky2:#2f5ea8; --navy:#a9bcff; --red:#ff6b80;
  --pink:#ff8db0; --pink-soft:#3a1f33; --hl:#5a2a45; --mint:#4fd6a8; --mint-soft:#143329;
  --blue:#78b4ff; --blue-soft:#1b2c52; --coral:#ff6b80; --coral-soft:#3b1f2a;
  --btn:#eef3ff; --btn-ink:#16213f; --glass:rgba(16,26,56,.82); --glass-ink:#eef3ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1530; --card:#16213f; --ink:#eef3ff; --muted:#9fb0d4; --line:#253358;
  --sky1:#18346c; --sky2:#2f5ea8; --navy:#a9bcff; --red:#ff6b80;
  --pink:#ff8db0; --pink-soft:#3a1f33; --hl:#5a2a45; --mint:#4fd6a8; --mint-soft:#143329;
  --blue:#78b4ff; --blue-soft:#1b2c52; --coral:#ff6b80; --coral-soft:#3b1f2a;
  --btn:#eef3ff; --btn-ink:#16213f; --glass:rgba(16,26,56,.82); --glass-ink:#eef3ff; color-scheme:dark}
*{box-sizing:border-box}
html,body{overscroll-behavior-y:none}
body{word-break:keep-all;overflow-wrap:anywhere;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body.reeling{overflow:hidden;background:var(--reel-bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.reeling::before{display:none}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(100px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
h1,h2{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:1.85rem;line-height:1.2}
h2{font-size:1.3rem}
.ja{font-family:var(--font-ja)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.small{font-size:.85rem}
.hl{color:var(--pink)}
.panel{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(43,134,238,.06)}
.label{font-size:.75rem;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:99px;font-weight:700;min-height:50px;background:var(--card);border:2px solid var(--line)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.yellow{background:var(--pink);color:#fff;border-color:var(--pink)}
.btn.good{background:var(--mint);color:#fff;border-color:var(--mint)}
.btn.bad{background:var(--coral);color:#fff;border-color:var(--coral)}
.btn.wide{flex:1}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;flex:none}
/* top */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.brand{font-family:var(--font-display);font-size:1.2rem}
.chipset{display:flex;gap:6px}
.flame{display:inline-flex;align-items:center;gap:4px;padding:6px 12px 6px 9px;border-radius:99px;background:var(--card);font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 1px 0 var(--line)}
.flame svg{width:18px;height:18px;color:var(--pink)}
.flame.off svg{color:var(--muted)}
.dday{padding:6px 12px;border-radius:99px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-variant-numeric:tabular-nums}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(170deg,var(--sky1) 0%,var(--sky2) 100%);color:#fff;min-height:330px;display:flex;flex-direction:column;justify-content:flex-end}
.flare{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.7),rgba(255,255,255,0) 70%)}
.flare.f1{width:120px;height:120px;left:-30px;top:30px;opacity:.55}
.flare.f3{width:220px;height:220px;right:-80px;top:-60px;opacity:.35}
.hero .say{position:absolute;left:18px;top:18px;right:46%;z-index:2}
.bubble{display:inline-block;background:#fff;color:#1d2747;padding:10px 14px;border-radius:18px 18px 18px 4px;font-weight:600;font-size:.9rem;line-height:1.4;box-shadow:0 6px 18px rgba(20,40,90,.18)}
.bubble b{color:#e0384f}
.hero .info{position:relative;z-index:2;margin:0 10px 10px;padding:14px 14px 12px;border-radius:20px;background:var(--glass);color:var(--glass-ink);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tier{display:flex;align-items:flex-end;gap:12px}
.grade{font-family:var(--font-display);font-size:3rem;line-height:.95;color:var(--blue)}
.grade small{font-size:1.2rem;color:var(--glass-ink);margin-left:2px}
.next{font-size:.82rem;color:var(--muted);padding-bottom:4px}
.next b{color:var(--glass-ink)}
.xpbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--pink));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}
.ladder span{text-align:center;font-size:.72rem;font-weight:700;padding:4px 0;border-radius:8px;background:var(--blue-soft);color:var(--muted)}
.ladder span.done{color:var(--blue)}
.ladder span.now{background:var(--btn);color:var(--btn-ink)}
/* name card */
.namecard{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.ava{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--card);box-shadow:0 0 0 2px var(--pink);background:linear-gradient(170deg,var(--sky1),var(--sky2))}
.lab{font-weight:700;font-size:.88rem}.lab small{font-weight:400;color:var(--muted);margin-left:4px}
.inp{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-top:-4px}
/* today */
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.5rem;font-weight:400}
.ring b small{font-size:.8rem;margin-left:1px}
.mission{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:16px;background:var(--bg)}
.mission .ck{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.mission.done .ck{background:var(--pink);border-color:var(--pink)}
.mission .ck svg{width:15px;height:15px}
.mission div{flex:1;min-width:0}
.mission small{display:block;color:var(--muted);font-size:.8rem}
.mission .xp{font-size:.75rem;font-weight:700;color:var(--blue);flex:none}
.mission.done b{color:var(--muted)}
.prog4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prog4 div{padding:12px;border-radius:16px;background:var(--bg)}
.prog4 b{font-family:var(--font-display);font-weight:400;font-size:1.4rem}
.prog4 .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.prog4 .bar i{display:block;height:100%;background:var(--mint)}
/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 6px;border-radius:18px;background:var(--bg);font-size:.78rem;font-weight:600}
.bdg .ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--muted)}
.bdg .ic svg{width:24px;height:24px}
.bdg.got .ic{background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff}
.bdg:not(.got){color:var(--muted)}
.bdg small{font-weight:400;color:var(--muted);font-size:.7rem;line-height:1.3}
/* 50음도 */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:99px;padding:4px;box-shadow:0 1px 0 var(--line)}
.seg button{padding:10px;border-radius:99px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--btn);color:var(--btn-ink)}
.gojuon{display:flex;flex-direction:column;gap:6px}
.grow{display:grid;grid-template-columns:52px repeat(5,1fr);gap:5px;align-items:stretch}
.grow .rh{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:.78rem;line-height:1.2;padding:4px 2px}
.grow .rh svg{width:16px;height:16px}
.gcell{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:58px;border-radius:12px;background:var(--card);box-shadow:0 1px 0 var(--line);position:relative}
.gcell b{font-family:var(--font-ja);font-weight:600;font-size:1.55rem;line-height:1.1}
.gcell small{font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums}
.gcell.empty{background:transparent;box-shadow:none}
.gcell.s{box-shadow:inset 0 0 0 2px var(--line)}
.gcell.k{background:var(--blue-soft)}
.gcell.m{background:var(--mint-soft)} .gcell.m small{color:var(--mint)}
.gcell.u{background:var(--coral-soft)} .gcell.u small{color:var(--coral)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
/* quiz list */
.mode{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:16px;border-radius:22px;background:var(--card);box-shadow:0 1px 0 var(--line)}
.mode .ic{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.mode .ic svg{width:26px;height:26px}
.mode small{display:block;color:var(--muted);font-size:.82rem}
.mode .cnt{font-family:var(--font-display);font-size:1.6rem}
/* record */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:14px 8px;border-radius:16px;background:var(--bg);text-align:center}
.stat b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.7rem;line-height:1.1}
.stat span{font-size:.75rem;color:var(--muted)}
.wrongs .w{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.wrongs .w:first-child{border-top:0}
.wrongs .jc{font-family:var(--font-ja);font-weight:600;font-size:1.5rem;width:36px;text-align:center}
.wrongs .k{flex:1;color:var(--muted);font-size:.88rem;min-width:0}
.tag{font-size:.75rem;font-weight:700;color:var(--coral);flex:none;font-variant-numeric:tabular-nums}
.speak{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--blue-soft);color:var(--blue);flex:none}
.speak svg{width:20px;height:20px}
.qtype{display:flex;flex-direction:column;gap:8px}
.qtype div{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-size:.85rem}
.qtype .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.qtype .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--pink))}
.export textarea{width:100%;min-height:120px;font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}

/* ---------- 릴스 ---------- */
.feedwrap{position:fixed;inset:0;z-index:5;background:var(--reel-bg)}
.feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.feed::-webkit-scrollbar{display:none}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;color:var(--reel-ink);
  background:radial-gradient(120% 70% at 85% 0%,rgba(255,255,255,.22),transparent 60%),linear-gradient(170deg,var(--g1,#163a8c) 0%,var(--g2,#2b86ee) 62%,var(--g3,#79bdfb) 100%);
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  padding:calc(70px + env(safe-area-inset-top,0px)) max(84px,calc(env(safe-area-inset-right,0px) + 76px)) calc(150px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.reel.center{padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.reel .petal{position:absolute;width:12px;height:9px;border-radius:12px 0;background:rgba(255,214,228,.85);top:-20px;pointer-events:none;animation:fall linear infinite}
.ftop{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;color:#fff;pointer-events:none}
.ftop>*{pointer-events:auto}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:rgba(10,18,45,.38);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-weight:700;font-size:.85rem;white-space:nowrap}
.fchip svg{width:16px;height:16px}
.fchip .ja{font-size:1rem;font-weight:600}
.ftop .grow1{flex:1;min-width:0}
.fprog{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 50px);left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;gap:3px;pointer-events:none}
.fprog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
.fprog i.on{background:#fff}
.fprog i.cur{background:#ffd3e1}
.ficon{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(10,18,45,.38);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ficon svg{width:20px;height:20px}
.kbig{font-family:var(--font-ja);font-weight:600;font-size:min(44vw,30vh,230px);line-height:1;text-shadow:0 8px 30px rgba(10,30,90,.35);user-select:none;-webkit-user-select:none;cursor:pointer;touch-action:manipulation}
.kread{display:inline-flex;gap:10px;align-items:baseline;margin-top:6px;padding:6px 16px;border-radius:99px;background:var(--reel-glass);border:1px solid var(--reel-line);font-weight:700}
.kread .r{font-size:1.25rem;letter-spacing:.04em}
.kread .h{font-family:var(--font-display);font-size:1.25rem;color:#ffe08a}
.excard{margin-top:16px;width:100%;max-width:300px;padding:12px 14px;border-radius:20px;background:var(--reel-glass);border:1px solid var(--reel-line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left}
.excard .w{font-family:var(--font-ja);font-weight:600;font-size:1.6rem;line-height:1.2}
.excard .w b{color:#ffd3e1;text-decoration:underline 3px;text-underline-offset:5px}
.excard .m{font-size:.9rem;color:var(--reel-dim);grid-column:1}
.excard .m .kj{font-family:var(--font-ja);color:#fff;margin-left:4px}
.excard .speak{grid-row:1/3;grid-column:2;background:rgba(255,255,255,.2);color:#fff}
.rail{position:absolute;z-index:3;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;align-items:center}
.rail button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.rail .rb{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(10,18,45,.32);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .15s}
.rail button:active .rb{transform:scale(.9)}
.rail .rb svg{width:26px;height:26px}
.rail .on .rb{background:#fff;color:var(--red)}
.rail .on.again .rb{color:#1d4fb8}
.rail .ava2{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:linear-gradient(170deg,#2b86ee,#9ad0ff)}
.cap{position:absolute;z-index:3;left:max(16px,env(safe-area-inset-left,0px));right:max(84px,calc(env(safe-area-inset-right,0px) + 76px));bottom:calc(84px + env(safe-area-inset-bottom,0px));text-align:left;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.cap .who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem}
.cap .who img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1.5px solid #fff;background:linear-gradient(170deg,#2b86ee,#9ad0ff)}
.cap .who span{font-weight:500;opacity:.8;font-size:.8rem}
.cap p{margin:6px 0 0;font-size:.9rem;line-height:1.45}
.cap p b{color:#ffe08a}
.swipe{position:absolute;left:50%;bottom:calc(66px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:.72rem;font-weight:700;opacity:.85;animation:nudge 1.8s ease-in-out infinite;pointer-events:none;white-space:nowrap}
.swipe svg{width:20px;height:20px}
.burst{position:absolute;left:50%;top:44%;width:120px;height:120px;margin:-60px 0 0 -60px;color:#ff4f7d;pointer-events:none;z-index:4;animation:burst .8s ease-out forwards;filter:drop-shadow(0 6px 18px rgba(255,79,125,.5))}
/* intro */
.ilabel{font-size:.78rem;font-weight:700;letter-spacing:.1em;opacity:.85}
.ititle{font-family:var(--font-display);font-size:3.4rem;line-height:1.05;margin:6px 0 14px}
.ititle .ja{font-weight:600}
.irow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.irow span{display:flex;flex-direction:column;align-items:center;justify-content:center;width:58px;height:70px;border-radius:16px;background:var(--reel-glass);border:1px solid var(--reel-line)}
.irow b{font-family:var(--font-ja);font-weight:600;font-size:2rem;line-height:1.1}
.irow small{font-size:.72rem;opacity:.85}
.isay{display:flex;align-items:flex-end;gap:10px;margin-top:22px;text-align:left;max-width:340px}
.isay img{width:84px;height:104px;object-fit:cover;object-position:50% 8%;flex:none;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.isay .bubble{font-size:.92rem}
/* quiz reel */
.qr{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:360px}
.qtag{display:inline-flex;gap:6px;align-items:center;font-size:.75rem;font-weight:700;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.18)}
.qtag.rev{background:#ffd3e1;color:#9b1c46}
.qprompt{font-family:var(--font-ja);font-weight:600;font-size:min(32vw,20vh,150px);line-height:1;text-shadow:0 8px 30px rgba(10,30,90,.35)}
.qprompt.txt{font-family:var(--font-display);font-weight:400;font-size:3rem}
.qlisten{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;color:#fff}
.qlisten svg{width:56px;height:56px}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.qopt{min-height:64px;padding:10px;border-radius:18px;background:rgba(255,255,255,.94);color:#1d2747;font-weight:700;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 16px rgba(10,20,60,.18)}
.qopt .ja{font-size:2rem;font-weight:600}
.qopt.right{background:#14a378;color:#fff}
.qopt.wrong{background:#e0384f;color:#fff;animation:shake .35s}
.qopt.dim{opacity:.55}
.qfeed{display:flex;align-items:flex-end;gap:10px;text-align:left;width:100%;animation:pop .35s}
.qfeed img{width:70px;height:88px;object-fit:cover;object-position:50% 8%;flex:none}
.qfeed .bubble small{display:block;color:#e0384f;font-size:.75rem;font-weight:700}
.combo{font-family:var(--font-display);font-size:1.15rem;color:#ffe08a;min-height:1.4rem}
/* clear / result */
.clearpic{width:170px;height:200px;object-fit:cover;object-position:52% 10%;animation:hop .7s ease-out;filter:drop-shadow(0 12px 24px rgba(10,30,90,.35))}
.ctitle{font-family:var(--font-display);font-size:2.4rem;line-height:1.1}
.cstats{display:flex;gap:8px;justify-content:center;margin:12px 0 16px;flex-wrap:wrap}
.cstats span{padding:8px 12px;border-radius:14px;background:var(--reel-glass);border:1px solid var(--reel-line);font-size:.85rem;font-weight:700}
.cstats .ja{font-size:1.2rem}
.rbtns{display:flex;gap:10px;width:100%;max-width:340px}
.rbtn{flex:1;min-height:50px;border-radius:99px;font-weight:700;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);color:#fff}
.rbtn.solid{background:#fff;color:#1d2747;border-color:#fff}
.bigscore{font-family:var(--font-display);font-size:5rem;line-height:1}
.bigscore small{font-size:1.8rem;opacity:.75}
.misslist{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0 16px}
.misslist button{padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:.85rem}
.misslist .ja{font-size:1.3rem;margin-right:4px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.dark{background:rgba(6,12,32,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 -1px 0 rgba(255,255,255,.08)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:.72rem;font-weight:600;color:var(--muted);position:relative}
nav.dark button{color:rgba(255,255,255,.62)}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--blue)}
nav.dark button.on{color:#fff}
nav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:4px;border-radius:0 0 3px 3px;background:repeating-linear-gradient(-45deg,var(--navy) 0 5px,var(--card) 5px 6px,var(--red) 6px 9px,var(--card) 9px 10px)}
nav.dark button.on::before{background:#fff}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:#fff;font-size:.68rem;line-height:18px;font-variant-numeric:tabular-nums}
/* effects */
.float{position:fixed;z-index:40;font-family:var(--font-display);font-size:1.4rem;color:#ffe08a;pointer-events:none;animation:up .9s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 18px;border-radius:99px;font-size:.88rem;font-weight:600;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.cheer{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-20px);z-index:31;width:min(420px,calc(100% - 24px));min-height:72px;padding:10px 14px 10px 88px;border-radius:22px;background:#fff;color:#1d2747;box-shadow:0 14px 36px rgba(10,20,60,.32);opacity:0;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.3);pointer-events:none;display:flex;align-items:center}
.cheer img{position:absolute;left:8px;bottom:0;width:72px;height:96px;object-fit:cover;object-position:50% 6%;border-radius:18px 18px 0 16px;background:linear-gradient(170deg,#2b86ee,#9ad0ff)}
.cheer.show{opacity:1;transform:translate(-50%,0)}
.cheer p{margin:0;font-weight:700;font-size:.98rem;line-height:1.4;min-width:0}
.cheer p small{display:block;font-weight:700;color:#e0384f;font-size:.75rem}
.cheer.ok{box-shadow:0 0 0 3px #14a378,0 14px 36px rgba(10,20,60,.32)} .cheer.no{box-shadow:0 0 0 3px #ff6f9a,0 14px 36px rgba(10,20,60,.32)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,12,32,.6);display:flex;align-items:center;justify-content:center;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.sheet{position:relative;background:var(--card);color:var(--ink);border-radius:28px;max-width:380px;width:100%;padding:18px;animation:pop .35s;display:flex;flex-direction:column;gap:12px}
.wbox{position:relative;width:100%;aspect-ratio:1;max-width:100%;border-radius:20px;background:var(--bg);overflow:hidden;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:50% 50%;background-position:center}
.wbox .guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-ja);font-weight:400;font-size:min(62vw,230px);line-height:1;color:var(--muted);opacity:.28;pointer-events:none}
.wbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.wsvg,.wsvg svg{position:absolute;inset:0;width:100%;height:100%}
.sheet{max-height:calc(100% - 24px);overflow-y:auto}
.wchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.wchip{min-width:42px;height:42px;padding:0 6px;border-radius:12px;background:var(--bg);font-family:var(--font-ja);font-weight:600;font-size:1.25rem;box-shadow:inset 0 0 0 2px var(--line)}
.wchip.on{background:var(--btn);color:var(--btn-ink);box-shadow:none}
.wchip.done{color:var(--mint);box-shadow:inset 0 0 0 2px var(--mint)}
.wpen{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--blue)}
.wpen svg{width:17px;height:17px}
.sg path{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.sa path{fill:none;stroke:var(--ink);stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round;opacity:.82}
.sa path.cur{stroke:var(--red);opacity:1}
.sn text{font-size:7px;font-weight:700;fill:var(--red);font-family:var(--font-body);transition:opacity .2s}
.stage{position:fixed;inset:0;z-index:70;background:linear-gradient(175deg,#1f74e0 0%,#7cc2ff 70%,#cfe9ff 100%);display:flex;flex-direction:column;align-items:center;overflow:hidden;cursor:pointer;animation:fadein .3s ease-out;padding-top:env(safe-area-inset-top,0px)}
.stage .say{position:relative;z-index:3;margin:18px auto 0;max-width:520px;width:calc(100% - 32px);background:#fff;color:#1d2747;border-radius:24px 24px 24px 6px;padding:16px 18px;box-shadow:0 12px 30px rgba(10,30,80,.25);animation:pop .45s .15s both}
.stage .say .jl{font-family:var(--font-ja);font-weight:600;font-size:1.5rem;line-height:1.35;min-height:1.35em}
.stage .say .ko{margin-top:6px;color:#5f6b8a;font-size:.95rem;opacity:0;transition:opacity .4s}
.stage .say .ko.on{opacity:1}
.stage .say .who{font-size:.78rem;font-weight:700;color:#e0384f;margin-bottom:4px}
.stage .figure{position:relative;flex:1;width:100%;display:flex;justify-content:center;align-items:flex-end;min-height:0;z-index:2}
.stage .figure img{height:100%;max-height:100%;width:auto;max-width:100%;object-fit:contain;object-position:50% 100%;transform-origin:50% 100%;animation:enter .6s cubic-bezier(.2,.9,.3,1.2) both,sway 5s .6s ease-in-out infinite}
.stage .hint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:3;color:#fff;font-size:.8rem;font-weight:600;background:rgba(20,40,90,.35);padding:6px 14px;border-radius:99px;white-space:nowrap}
.stage.out{animation:fadeout .25s ease-in forwards}
.charbtn{position:absolute;right:-6px;bottom:0;width:54%;max-width:260px;height:100%;padding:0;z-index:1}
.charbtn img{width:100%;height:100%;object-fit:cover;object-position:50% 8%;-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 100%);mask-image:linear-gradient(to bottom,#000 72%,transparent 100%);transform-origin:50% 100%}
.charbtn img.alt{position:absolute;inset:0;opacity:0;animation:bob 3.6s ease-in-out infinite,swap 14s ease-in-out infinite}
.charbtn img:not(.alt){animation:bob 3.6s ease-in-out infinite,swapb 14s ease-in-out infinite}
.charbtn .tapme{position:absolute;right:14px;top:16px;background:#fff;color:#e0384f;font-weight:700;font-size:.75rem;padding:4px 10px;border-radius:99px;box-shadow:0 4px 12px rgba(20,40,90,.2);animation:nudge 2.4s ease-in-out infinite}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}

/* ---------- 단원 ---------- */
ruby{ruby-position:over}
rt{font-size:.42em;font-weight:500;letter-spacing:0;opacity:.9}
.nofuri rt,.nofuri .wsub .kana,.nofuri .rd{visibility:hidden}
.fmode{display:flex;gap:2px;padding:3px;border-radius:99px;background:rgba(10,18,45,.38);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fmode button{padding:5px 10px;border-radius:99px;font-weight:700;font-size:.8rem;color:#fff;white-space:nowrap}
.fmode button.on{background:#fff;color:#1d2747}
.utag{font-size:.75rem;font-weight:700;letter-spacing:.06em;opacity:.85;margin-bottom:10px}
.wbig{font-family:var(--font-ja);font-weight:600;line-height:1.25;text-shadow:0 8px 30px rgba(10,30,90,.35);cursor:pointer;touch-action:manipulation;max-width:100%;user-select:none;-webkit-user-select:none}
.wbig.l1{font-size:min(28vw,20vh,160px)}.wbig.l2{font-size:min(17vw,13vh,110px)}.wbig.l3{font-size:min(11vw,9vh,72px)}.wbig.l4{font-size:min(7.6vw,6.4vh,52px)}
.wmean{margin-top:14px;display:inline-flex;padding:8px 18px;border-radius:99px;background:#fff;color:#1d2747;font-weight:700;font-size:1.12rem;max-width:100%}
.wsub{margin-top:10px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.wsub .kana{font-family:var(--font-ja);font-weight:600;font-size:1.15rem}
.yb{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35)}
.conj{margin-top:14px;width:100%;max-width:300px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;padding:10px 14px;border-radius:20px;background:var(--reel-glass);border:1px solid var(--reel-line);text-align:left}
.conj span{font-size:.75rem;font-weight:700;opacity:.8}
.conj b{font-family:var(--font-ja);font-weight:600;font-size:1.25rem;line-height:1.5}
.conj b.hi{color:#ffe08a}
.conj .speak{width:34px;height:34px;background:rgba(255,255,255,.2);color:#fff}
.gcard{width:100%;max-width:380px;text-align:left;padding:18px;border-radius:24px;background:rgba(255,255,255,.96);color:#1d2747;box-shadow:0 14px 34px rgba(10,20,60,.25)}
.gt{font-family:var(--font-ja);font-weight:600;font-size:1.35rem;line-height:1.45}
.gr{margin:6px 0 10px;font-size:.92rem;color:#3c4766;line-height:1.5}
.gr b{color:#d23552}
.gex{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:center;padding:9px 0;border-top:1px solid #e3ebf6}
.gex .j{font-family:var(--font-ja);font-weight:600;font-size:1.08rem;line-height:1.75}
.gex .k{font-size:.84rem;color:#5f6b8a;grid-column:1}
.gex .speak{grid-row:1/3;grid-column:2;width:38px;height:38px}
.gtip{margin-top:8px;padding:8px 12px;border-radius:12px;background:#ffe6ea;color:#9b1c46;font-size:.85rem;font-weight:600;line-height:1.7}
.dscene{font-size:.85rem;opacity:.9;margin-bottom:10px;max-width:360px}
.dlines{display:flex;flex-direction:column;gap:8px;width:100%;max-width:380px}
.dl{display:block;width:100%;text-align:left;padding:8px 14px;border-radius:18px 18px 18px 6px;background:rgba(255,255,255,.96);color:#1d2747;box-shadow:0 6px 16px rgba(10,20,60,.18)}
.dl:nth-child(even){border-radius:18px 18px 6px 18px;background:#fff6d6}
.dl .sp{font-size:.72rem;font-weight:700;color:#d23552}
.dl .j{display:block;font-family:var(--font-ja);font-weight:600;font-size:1.08rem;line-height:1.75}
.dl .k{display:block;font-size:.8rem;color:#5f6b8a}
.dbtns{display:flex;gap:8px;margin-top:12px;width:100%;max-width:340px}
.dbtns .rbtn{display:inline-flex;align-items:center;justify-content:center;gap:4px}
.dbtns .rbtn svg{width:18px;height:18px}
.gqp{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:100%}
.gqj{font-family:var(--font-ja);font-weight:600;font-size:min(12vw,9vh,60px);line-height:1.35;text-shadow:0 6px 20px rgba(10,30,90,.35)}
.gqk{font-family:var(--font-display);font-size:2rem;line-height:1.25}
.gqs{font-size:.92rem;font-weight:700;opacity:.9}
.gqline{font-family:var(--font-ja);font-weight:600;font-size:1.18rem;line-height:1.8;background:rgba(255,255,255,.96);color:#1d2747;padding:12px 16px;border-radius:18px;text-align:left;max-width:100%}
.qopts.one{grid-template-columns:1fr}
.gqo .qopt .ja{font-size:1.3rem;line-height:1.6}
.gqo .qopt .ja.sm{font-size:1.05rem}
.qopts.one .qopt{min-height:52px}
.qopt .ja.sm{font-size:1.05rem;line-height:1.6;font-weight:600}
.uexpr{display:flex;flex-direction:column;gap:6px;width:100%;max-width:340px}
.uexpr div{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;padding:6px 12px;border-radius:14px;background:var(--reel-glass);border:1px solid var(--reel-line);text-align:left}
.uexpr span{font-size:.75rem;font-weight:700;opacity:.85}
.uexpr b{font-family:var(--font-ja);font-weight:600;font-size:1.02rem;line-height:1.7}
.ucard{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:22px;background:var(--card);box-shadow:0 1px 0 var(--line)}
.unum{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.6rem;color:#fff}
.ucard .ut{min-width:0;display:flex;flex-direction:column;gap:2px}
.ucard .ut b{font-family:var(--font-ja);font-weight:600;font-size:1.1rem;line-height:1.6}
.ucard small{color:var(--muted);font-size:.78rem}
.ubar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}
.ubar i{display:block;height:100%;background:var(--mint)}
.backbtn{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--blue);padding:4px 0;align-self:flex-start}
.seg5{display:flex;gap:2px;overflow-x:auto;background:var(--card);border-radius:99px;padding:4px;box-shadow:0 1px 0 var(--line);scrollbar-width:none}
.seg5 button{flex:1;padding:9px 8px;border-radius:99px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg5 button.on{background:var(--btn);color:var(--btn-ink)}
.wlist{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:center;width:100%;text-align:left;padding:8px 2px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .j{font-family:var(--font-ja);font-weight:600;font-size:1.15rem;line-height:1.75}
.wrow .k{font-size:.84rem;color:var(--muted);grid-column:1}
.wrow .st{grid-row:1/3;grid-column:2;display:flex;gap:6px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.s{background:var(--blue-soft);box-shadow:inset 0 0 0 2px var(--blue)}.dot.k{background:var(--blue)}.dot.m{background:var(--mint)}.dot.u{background:var(--coral)}
.ybadge{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--blue-soft);color:var(--blue)}
.vtab{width:100%;border-collapse:collapse}
.vtab th{font-size:.72rem;color:var(--muted);text-align:left;padding:4px;font-weight:700}
.vtab td{padding:6px 4px;border-top:1px solid var(--line);font-family:var(--font-ja);font-weight:600;font-size:1rem;line-height:1.7;vertical-align:top}
.vtab td button{text-align:left}
.vtab td.k{font-family:var(--font-body);font-weight:700;font-size:.8rem;color:var(--muted)}
.lgc{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 1px 0 var(--line)}
.lgc .gr{color:var(--muted)}
.lgc .gr b{color:var(--coral)}
.lgc .gex{border-color:var(--line)}.lgc .gex .k{color:var(--muted)}
.lgc .gtip{background:var(--coral-soft);color:var(--coral)}
.dlist .dl{box-shadow:none;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.dlist .dl:nth-child(even){background:var(--blue-soft)}
.dlist .dl .k{color:var(--muted)}
.dlist .dl .sp{color:var(--coral)}
.jc{max-height:calc(100vh - 230px);overflow-y:auto}
.jci{display:flex;flex-direction:column;padding:7px 0;border-top:1px solid #e3ebf6;font-size:.86rem;color:#3c4766}
.jci b{color:#1d2747;font-size:.95rem}.jci b .ja{font-weight:600;color:#d23552;font-size:.9rem}
.lgc .jci{border-color:var(--line);color:var(--muted)}.lgc .jci b{color:var(--ink)}
.lscript{width:100%;text-align:left;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.18);font-size:.95rem;line-height:1.8}
.lscript b{display:inline-block;width:20px;color:#ffe08a}
.reel.exr{justify-content:flex-start;overflow-y:auto;padding-top:calc(72px + env(safe-area-inset-top,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.exr .qr{gap:8px}
.exr .qopts.one .qopt{min-height:44px;padding:8px 12px;border-radius:14px}
.exr .qopt .ja.sm{font-size:.98rem;line-height:1.5}
.exr .combo{min-height:0}
.exr .qfeed img{width:54px;height:68px}

/* ===== 오답 사진 노트 모듈 (수학 1등급 노트에서 검증) =====
   오프라인(종이)에서 푼 문제를 사진으로 찍어 → 채점(맞음/틀림/나중에) → 틀린 문제만 정리(출처·단원·이유·메모·정답 사진)
   → 1일·3일·7일 뒤 다시 풀기(문제 → 정답 확인 → 스스로 채점) → 3번 맞히면 졸업.
   사진은 그 기기의 IndexedDB에만 저장된다(서버로 가지 않음). 리포트 보낼 때 아이폰 공유 창으로 함께 보낸다.

   사용: PhotoNote.init({...}) 후 await PhotoNote.load()
     cfg.dbName      IndexedDB 이름. 앱마다 다르게(예 "math-note-photos", "suneung-note-photos")
     cfg.units()     단원 목록 [{id,label,short,group}] (label: 선택 상자, short: 태그·파일 이름, group: 선택 상자 묶음)
     cfg.reasons     틀린 이유 [["c","개념을 몰랐어요"],...]  — 과목마다 다르게
     cfg.sources     출처 ["학교","학원","모의고사","기타"]
     cfg.store()     앱 저장 객체(오프라인 채점 통계 pnOff, 마지막 출처 pnLastSrc를 여기에 둔다)
     cfg.save()      앱 저장 함수
     cfg.today(), cfg.addDays(s,n)   날짜 문자열 "YYYY-MM-DD"
     cfg.toast(msg), cfg.onXP(n,el), cfg.onChange() (화면 새로 그리기), cfg.redraw(cardId) (복습 카드 하나 다시 그리기)
     cfg.render(s)   수식 렌더 함수(선택), cfg.confetti(n) (선택)
   앱이 연결할 곳: + 버튼 → PhotoNote.openCapture(),  오답노트 → PhotoNote.openList(),
     click 핸들러 맨 앞 if(PhotoNote.click(e))return;  change 핸들러 맨 앞 if(PhotoNote.change(e))return;
     복습 피드에 PhotoNote.dueCards() 를 섞고, 카드 본문은 PhotoNote.cardHTML(card.ph)
     리포트: PhotoNote.unsent(), PhotoNote.fileName(p,i), PhotoNote.label(p), PhotoNote.markSent(list), PhotoNote.reportLines() */
/* ===== 도움말 모듈 (수학 1등급 노트에서 검증) =====
   화면 위 "?" 버튼 → 사용법 창. 지금 보고 있는 탭의 설명으로 바로 이동하고, 위쪽 메뉴로 항목 사이를 이동한다.
   앱과 독립된 겹침 화면(#ahLayer)을 쓰고, 클릭 처리도 스스로 한다. 앱은 init()과 버튼 배치만 하면 된다.
   사용:
     AppHelp.init({sections:[["feed","피드 (첫 화면)",["설명 1","설명 2"]], ...], footer:"맨 아래 한 줄", seenKey:"suneung-help-seen"});
     화면 위:  AppHelp.chip("feed")   → <button data-ah="feed">?</button> HTML 문자열
     다른 곳:  <button data-ah="plus">사용법</button>  (아무 요소에나 data-ah="섹션키")
     처음 한 번: AppHelp.firstRun("feed")  (이름 입력 직후 등에서 부른다. 이미 봤으면 열지 않음) */
const AppHelp=(function(){
  let C={title:"사용법",sections:[],footer:"",seenKey:"app-help-seen"};
  const nav=t=>t.replace(/\s*\(.*\)\s*$/,"");
  function init(cfg){C=Object.assign(C,cfg)}
  function chip(focus,label){return `<button class="ah-chip" data-ah="${focus}" aria-label="${label||"도움말"}">?</button>`}
  function open(focus){
    focus=focus||(C.sections[0]||[])[0];
    let el=document.getElementById("ahLayer");if(!el){el=document.createElement("div");el.id="ahLayer";document.body.appendChild(el)}
    el.innerHTML=`<div class="ah-wrap" data-ah-close><div class="ah-sheet" role="dialog" aria-modal="true" aria-label="${C.title}">
      <div class="ah-head"><div class="ah-row"><h2>${C.title}</h2><button class="ah-btn" data-ah-close>닫기</button></div>
      <div class="ah-nav">${C.sections.map(([k,t])=>`<button data-ah-go="${k}" class="${k===focus?"on":""}">${nav(t)}</button>`).join("")}</div></div>
      ${C.sections.map(([k,t,items])=>`<section class="ah-sec ${k===focus?"on":""}" id="ah-${k}"><h3>${t}</h3><ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul></section>`).join("")}
      ${C.footer?`<p class="ah-foot">${C.footer}</p>`:""}</div></div>`;
    requestAnimationFrame(()=>{const s=document.getElementById("ah-"+focus);if(s)s.scrollIntoView({block:"start"})});
    try{localStorage.setItem(C.seenKey,"1")}catch(e){}
  }
  function close(){const el=document.getElementById("ahLayer");if(el)el.innerHTML=""}
  function firstRun(focus){let seen=null;try{seen=localStorage.getItem(C.seenKey)}catch(e){}if(!seen)setTimeout(()=>open(focus),1200)}
  document.addEventListener("click",e=>{
    const go=e.target.closest("[data-ah-go]");if(go){const k=go.dataset.ahGo,s=document.getElementById("ah-"+k);document.querySelectorAll(".ah-nav button").forEach(b=>b.classList.toggle("on",b.dataset.ahGo===k));if(s)s.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
    const cl=e.target.closest("[data-ah-close]");if(cl){if(cl.classList.contains("ah-wrap")&&e.target!==cl)return;close();return}
    const op=e.target.closest("[data-ah]");if(op){e.preventDefault();open(op.dataset.ah)}
  });
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.querySelector("#ahLayer .ah-wrap"))close()});
  return{init,open,close,chip,firstRun};
})();

const PhotoNote=(function(){
  let C=null,db=null,ITEMS=[];const URLS={},RS={};let Q=[],T=null,listTab="review",viewId=null,confirmDel=null;
  const GAPS=[1,3,7];
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const R=s=>C.render?C.render(s):esc(s);
  const today=()=>C.today(),addDays=(s,n)=>C.addDays(s,n);
  const url=(p,k="blob")=>{const key=p.id+k;if(!URLS[key]&&p[k])URLS[key]=URL.createObjectURL(p[k]);return URLS[key]||""};
  const drop=(p)=>{["blob","ans"].forEach(k=>{if(URLS[p.id+k]){URL.revokeObjectURL(URLS[p.id+k]);delete URLS[p.id+k]}})};
  const st=()=>{const s=C.store();s.pnOff=s.pnOff||{};return s};
  const why=k=>(C.reasons.find(r=>r[0]===k)||[,""])[1];
  const unitLabel=id=>{const u=C.units().find(x=>x.id===id);return u?(u.short||u.label):"단원 미정"};  /* 태그·파일 이름에는 짧은 이름(short) */
  /* --- 저장소 --- */
  function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open(C.dbName,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("photos"))r.result.createObjectStore("photos",{keyPath:"id"})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}

  const del=id=>new Promise((res,rej)=>{if(!db)return rej();const r=tx("readwrite").delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
  /* 예전 구조(sheet, grad)에서 새 구조(unit, state)로 자동 이전 */
  function migrate(p){if(p.state)return false;p.unit=p.unit||p.sheet||null;p.state=p.grad?"grad":"review";p.stage=p.stage||0;p.due=p.due||today();delete p.sheet;delete p.grad;return true}
  async function load(){try{db=await idb();ITEMS=await new Promise((res,rej)=>{const r=tx("readonly").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});for(const p of ITEMS)if(migrate(p))await put(p)}catch(e){ITEMS=[]}}
  /* --- 사진 줄이기·돌리기 (긴 변 1200px, JPEG 0.7) --- */
  async function shrink(file,rot=0){const u=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("이미지를 열 수 없어요"));i.src=u});
      const k=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k),sw=rot%180!==0,c=document.createElement("canvas");
      c.width=sw?h:w;c.height=sw?w:h;const x=c.getContext("2d");x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/180);x.drawImage(img,-w/2,-h/2,w,h);
      return await new Promise(r=>c.toBlob(r,"image/jpeg",.7))}finally{URL.revokeObjectURL(u)}}
  const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  /* --- 겹쳐 띄우는 화면 --- */
  function layer(html,tall){let el=document.getElementById("pnLayer");if(!el){el=document.createElement("div");el.id="pnLayer";document.body.appendChild(el)}

  const close=()=>{layer("");T=null;Q=[];viewId=null;confirmDel=null};
  function openCapture(){layer(`<h3 class="pn-h">오프라인 문제 채점</h3><p class="pn-muted">종이에 푼 문제를 찍고, 맞았는지 채점해요. 틀린 문제만 오답노트에 남아요.</p>

    <label class="pn-big" for="pnAlbum"><span class="pn-ic">🖼️</span><span><b>앨범에서 여러 장 고르기</b><small>학원·학교에서 찍어 둔 사진을 한꺼번에</small></span></label><input id="pnAlbum" type="file" accept="image/*" multiple hidden>

  function drawT(){const t=T,left=Q.length;
    if(t.step==="grade")return layer(`<div class="pn-row"><h3 class="pn-h">채점하기</h3><span class="pn-muted">${left?`남은 사진 ${left}장`:""}</span></div>

      <label class="pn-lab" for="pnUnit">어느 단원이야?</label><select class="pn-inp" id="pnUnit"><option value="">모름 / 나중에</option>${groups.map(g=>`${g?`<optgroup label="${esc(g)}">`:""}${U.filter(u=>(u.group||"")===g).map(u=>`<option value="${esc(u.id)}" ${t.unit===u.id?"selected":""}>${esc(u.label)}</option>`).join("")}${g?"</optgroup>":""}`).join("")}</select>
      <div class="pn-lab">왜 틀렸어?</div><div class="pn-chips">${C.reasons.map(([k,n])=>`<button class="${t.why===k?"on":""}" data-pn="t-why" data-v="${k}">${esc(n)}</button>`).join("")}</div>
      <div class="pn-lab">정답·해설 사진 <span class="pn-muted">(있으면 복습 때 바로 맞춰 볼 수 있어요)</span></div>

      <label class="pn-lab" for="pnMemo">메모 <span class="pn-muted">(선택)</span></label><input class="pn-inp" id="pnMemo" maxlength="80" value="${esc(t.memo)}" placeholder="예: 부호 실수, 공식 헷갈림">

  const keep=()=>{if(!T)return;const m=document.getElementById("pnMemo"),u=document.getElementById("pnUnit");if(m)T.memo=m.value;if(u)T.unit=u.value||null};
  async function saveT(state,btn){keep();const t=T;const p={id:nid(),ts:new Date().toISOString(),blob:t.blob,ans:t.ans||null,src:t.src,unit:t.unit,why:t.why,memo:(t.memo||"").trim(),state,stage:0,due:state==="review"?addDays(today(),GAPS[0]):null,sent:false};

  function offline(ok){const s=st(),d=today();s.pnOff[d]=s.pnOff[d]||{r:0,w:0};s.pnOff[d][ok?"r":"w"]++;const ks=Object.keys(s.pnOff).sort();while(ks.length>60)delete s.pnOff[ks.shift()];C.save()}
  /* --- 오답노트 목록·상세 --- */
  function counts(){const c={inbox:0,review:0,grad:0,due:0};ITEMS.forEach(p=>{c[p.state]++;if(isDue(p))c.due++});return c}

  function edit(id){const p=ITEMS.find(x=>x.id===id);if(!p)return;T={edit:id,blob:p.blob,url:URL.createObjectURL(p.blob),step:"tag",src:p.src,unit:p.unit,why:p.why,memo:p.memo,ans:p.ans,ansUrl:p.ans?URL.createObjectURL(p.ans):null};drawT()}
  async function saveEdit(btn){keep();const p=ITEMS.find(x=>x.id===T.edit);if(!p)return;const wasInbox=p.state==="inbox";Object.assign(p,{src:T.src,unit:T.unit,why:T.why,memo:(T.memo||"").trim(),ans:T.ans||null});

  /* --- 복습 카드 (앱 피드 안) --- */
  function dueCards(){return ITEMS.filter(isDue).sort((a,b)=>a.due<b.due?-1:1).map(p=>({id:"ph-"+p.id,k:"photo",ph:p}))}
  function cardHTML(p){const r=RS[p.id]||(RS[p.id]={step:0});

  async function review(id,ok,btn){const p=ITEMS.find(x=>x.id===id);if(!p)return;const r=RS[id]||(RS[id]={});
    if(ok){p.stage++;if(p.stage>=GAPS.length){p.state="grad";p.due=null;r.done="졸업! 이 문제는 이제 끝";C.confetti&&C.confetti(150)}else{p.due=addDays(today(),GAPS[p.stage]);r.done=`좋아! ${GAPS[p.stage]}일 뒤에 한 번 더`}C.onXP&&C.onXP(8,btn)}
    else{p.stage=0;p.due=addDays(today(),1);r.done="괜찮아, 내일 다시 보자"}

  /* --- 리포트·내보내기 --- */
  function label(p){return [p.src,p.unit?unitLabel(p.unit):"단원 미정",p.why?why(p.why):null].filter(Boolean).join(" · ")}
  function fileName(p,i,suffix=""){const d=p.ts.slice(5,10).replace("-","");return `${(p.unit?unitLabel(p.unit):"단원미정").replace(/[\\/:*?"<>|\s]+/g,"")}_${p.src}_${d}_${i+1}${suffix}.jpg`}
  const unsent=()=>ITEMS.filter(p=>!p.sent&&p.state!=="inbox").sort((a,b)=>a.ts<b.ts?-1:1);
  function files(list){const out=[];list.forEach((p,i)=>{out.push(new File([p.blob],fileName(p,i),{type:"image/jpeg"}));if(p.ans)out.push(new File([p.ans],fileName(p,i,"_정답"),{type:"image/jpeg"}))});return out}
  async function markSent(list){for(const p of list){p.sent=today();try{await put(p)}catch(e){}}}
  function reportLines(list){const c=counts(),s=st(),L=[];const days=Object.keys(s.pnOff).sort().slice(-14);let r=0,w=0;days.forEach(d=>{r+=s.pnOff[d].r;w+=s.pnOff[d].w});
    L.push(`■ 오프라인 풀이 채점 (최근 14일): 맞음 ${r} · 틀림 ${w}`);days.slice(-7).forEach(d=>L.push(`- ${d}: 맞음 ${s.pnOff[d].r} · 틀림 ${s.pnOff[d].w}`));
    L.push("",`■ 오답 사진${list&&list.length?` (이번에 함께 보낸 ${list.length}문제)`:""}`);(list||[]).forEach((p,i)=>L.push(`- ${fileName(p,i)}${p.ans?" (+정답 사진)":""}: ${label(p)}${p.memo?" / 메모: "+p.memo:""}`));
    L.push(`- 정리 대기 ${c.inbox} · 복습 중 ${c.review} · 졸업 ${c.grad} · 오늘 복습 ${c.due}`);return L}
  async function exportAll(){const all=ITEMS.slice().sort((a,b)=>a.ts<b.ts?-1:1);if(!all.length){C.toast&&C.toast("내보낼 사진이 없어요");return}
    const f=files(all);try{if(navigator.canShare&&navigator.canShare({files:f})){await navigator.share({files:f,title:"오답 사진 백업"});return}}catch(e){if(e&&e.name==="AbortError")return}

  function whyCounts(){const o={};ITEMS.forEach(p=>{const k=p.why||"n";o[k]=(o[k]||0)+1});return o}

    ({close,capture:openCapture,list:()=>openList(),tab:()=>openList(v),view:()=>{confirmDel=null;openView(v)},export:exportAll,

function addDays(s,n){const[y,m,d]=s.split("-").map(Number);return ymd(new Date(y,m-1,d+n))}

function jong(n){const c=n.charCodeAt(n.length-1);return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0}
function sn(){return S.studentName||"친구"}
function tpl(t){const n=sn();return String(t).replace(/\{A\}/g,n+(jong(n)?"아":"야")).replace(/\{I\}/g,n+(jong(n)?"이":""))}
function nm(){return S.charName||"응원 친구"}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function cheer(txt,mood){
  const c=$("#cheer");c.classList.remove("ok","no");if(mood)c.classList.add(mood);
  const im=$("#cheerImg"),src=mood==="ok"?JUMP:CHAR;if(im.getAttribute("src")!==src)im.src=src;
  $("#cheerTxt").innerHTML=`<small>${esc(nm())}</small>${esc(tpl(txt))}`;
  c.classList.add("show");clearTimeout(cheer.t);cheer.t=setTimeout(()=>c.classList.remove("show"),2000);
}
function jaLine(){
  const h=new Date().getHours(),st=streak(),J=S.studentJa?S.studentJa+"、":"";
  const pool=[
    [`${h<11?"おはよう":h<18?"こんにちは":"こんばんは"}！ ${J}きょうも いっしょに がんばろう！`,`${h<11?"좋은 아침":h<18?"안녕":"좋은 저녁"}! {A}, 오늘도 같이 힘내자!`],
    [`${J}あいたかったよ！`,"{A}, 보고 싶었어!"],
    ["まちがえても だいじょうぶ。","틀려도 괜찮아."],
    ["すこしずつ、まいにち。","조금씩, 매일."],
    [`${J}すごい！ よく がんばったね。`,"{A} 대단해! 정말 열심히 했구나."],
    ["ひらがな、いっしょに よもう！","히라가나, 같이 읽어 보자!"]
  ];
  if(st>=2)pool.push([`${st}にち れんぞく だよ！`,`${st}일 연속이야!`]);
  const d=dday();if(d!==null&&d>0)pool.push([`しけんまで あと ${d}にち！`,`시험까지 앞으로 ${d}일!`]);
  const p=pick(pool);return[p[0],tpl(p[1])];
}
let stageTimer=null;
function openStage(){
  const[ja,ko]=jaLine();const el=document.createElement("div");el.className="stage";el.id="stage";el.setAttribute("role","dialog");el.setAttribute("aria-label",nm());
  el.innerHTML=`<div class="say"><div class="who">${esc(nm())}</div><div class="jl" id="stJa"></div><div class="ko" id="stKo">${esc(ko)}</div></div><div class="figure"><img src="${WAVE}" alt=""></div><div class="hint">탭하면 닫혀요</div>`;
  document.body.appendChild(el);speak(ja,.85);
  const t=$("#stJa");let i=0;clearInterval(stageTimer);
  if(reduce){t.textContent=ja;$("#stKo").classList.add("on")}
  else stageTimer=setInterval(()=>{i++;t.textContent=ja.slice(0,i);if(i>=ja.length){clearInterval(stageTimer);$("#stKo").classList.add("on")}},70);
}
function closeStage(){const el=$("#stage");if(!el)return;clearInterval(stageTimer);hardStop();el.classList.add("out");setTimeout(()=>el.remove(),240)}

/* ---------------- 발음 ---------------- */
let voice=null,unlocked=false,SPK=0,PLAYBTN=null;
/* 목소리 목록: 같은 이름이라도 고품질판은 voiceURI가 달라서 URI로 구분 */
const VQ=v=>/enhanced|premium|고품질|향상/i.test(v.voiceURI+" "+v.name);
function voicesOf(re,good){try{const seen=new Set();return speechSynthesis.getVoices().filter(v=>re.test(v.lang)&&!seen.has(v.voiceURI)&&seen.add(v.voiceURI)).sort((a,b)=>(VQ(b)-VQ(a))||((good.test(b.name)?1:0)-(good.test(a.name)?1:0)))}catch(e){return[]}}
const JAGOOD=/Kyoko|O-ren|Otoya|Hattori|Google/,KOGOOD=/Yuna|유나|Sora|Minsu|Google/;
function jaVoices(){return voicesOf(/^ja/i,JAGOOD)}
function koVoices(){return voicesOf(/^ko/i,KOGOOD)}
function pickVoice(){const vs=jaVoices();voice=(S.jaVoice&&vs.find(v=>v.voiceURI===S.jaVoice))||vs.find(v=>JAGOOD.test(v.name))||vs[0]||null}
try{pickVoice();speechSynthesis.addEventListener("voiceschanged",()=>{pickVoice();renderVoiceBox()})}catch(e){}
function utter(t,r){const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";if(voice)u.voice=voice;u.rate=r||.8;return u}
/* 모든 소리는 여기로: 먼저 하던 소리를 확실히 끊고(번호표 SPK), 전체 소리가 꺼져 있으면 아무것도 안 낸다 */
function clearPlay(){if(PLAYBTN){PLAYBTN.classList.remove("speaking");PLAYBTN=null}}
function hardStop(){SPK++;clearTimeout(onCardShown.t);try{speechSynthesis.cancel()}catch(e){}clearPlay();stopSpeak()}
function sayQueue(lines,rate,btn){hardStop();if(S.mute)return false;const tk=SPK,a=(lines||[]).filter(Boolean);if(!a.length)return false;
  try{if(btn){btn.classList.add("speaking");PLAYBTN=btn}a.forEach((t,i)=>{const u=utter(t,rate);if(i===a.length-1)u.onend=u.onerror=()=>{if(tk===SPK)clearPlay()};speechSynthesis.speak(u)})}
  catch(e){clearPlay();toast("이 기기에서는 발음 듣기를 쓸 수 없어요")}return true}
function speak(t,r){sayQueue([t],r)}
function speakSeq(a){sayQueue(a)}
function muteHint(){toast("전체 소리가 꺼져 있어요 · 위의 빨간 스피커를 눌러 켜요")}
/* 본문 🔊: 누르면 듣기, 듣는 중에 다시 누르면 멈춤 */
function tapPlay(btn,lines,rate){if(btn.classList.contains("speaking")){hardStop();return}if(S.mute){muteHint();return}sayQueue(lines,rate,btn)}
document.addEventListener("pointerdown",()=>{if(unlocked)return;unlocked=true;try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}},{capture:true});
function sayWord(x){return x.w==="-"?x.c:x.w}

const KJ=/([一-鿿々]+)\[([^\]]+)\]/g;

const UNIT_NS=[5,6,7];

const UNIT={},VERBS=[];
VERBS_RAW.split("\n").forEach(l=>{const[d,m,n,g,k,u,tip]=l.split("|");VERBS.push({d,m,n,g:+g,k,u:+u,tip:tip||""})});

  const U=Object.assign({n},UNITS_RAW[n]);
  const words=U.words.split("\n").filter(Boolean).map(l=>{const[j,k,y]=l.split("|");return{j,k,y:y||"",key:"w:"+j,u:n}});

  U.items=words.concat(verbs);U.wordCount=words.length;

const UA={"う":"わ","く":"か","ぐ":"が","す":"さ","つ":"た","ぬ":"な","ぶ":"ば","む":"ま","る":"ら"},UI={"う":"い","く":"き","ぐ":"ぎ","す":"し","つ":"ち","ぬ":"に","ぶ":"び","む":"み","る":"り"},UE={"う":"え","く":"け","ぐ":"げ","す":"せ","つ":"て","ぬ":"ね","ぶ":"べ","む":"め","る":"れ"};
function qConj(v,f){
  const d=v.d,st=d.slice(0,-1),e=d.slice(-1),right=f==="m"?v.m:v.n;let w;

function unitReels(n,withReview){

  out.push({t:"uintro",u:n});

    const ch=U.items.slice(i,i+8);ch.forEach((it,k)=>out.push({t:"word",u:n,i:i+k}));

  U.gram.forEach((g,gi)=>out.push({t:"gram",u:n,i:gi}));
  shuffle(U.quiz.map((_,k)=>k)).slice(0,4).forEach(k=>out.push({t:"gq",u:n,q:qGram(n,k)}));
  if(n===6||n===7)shuffle(VERBS.filter(v=>v.u<=n).slice()).slice(0,4).forEach(v=>out.push({t:"gq",u:n,q:qConj(v,n===6?"m":"n")}));
  out.push({t:"cult",u:n},{t:"jcult",u:n});
  shuffle(JCULT[n].ox.map((_,k)=>k)).slice(0,3).forEach(k=>out.push({t:"gq",u:n,q:qOX(n,k)}));
  ULISTEN[n].forEach((_,k)=>out.push({t:"gq",u:n,q:qListen(n,k)}));
  U.chunks.forEach((c,ci)=>out.push({t:"dlg",u:n,c:ci}));
  out.push({t:"gq",u:n,q:qDlg(n)},{t:"gq",u:n,q:qDlg(n)});
  out.push({t:"uclear",u:n});
  return out;
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function distract(x,n,sameScript){
  const conf=CONF.find(g=>g.includes(x.c));let pool=[];
  if(conf)pool=[...conf].filter(c=>c!==x.c&&BYC[c]);
  const rest=shuffle(ALL.filter(y=>y.c!==x.c&&(!sameScript||y.s===x.s)&&!pool.includes(y.c)).map(y=>y.c));
  const out=[];for(const c of shuffle(pool).concat(rest)){const y=BYC[c];if(y.ko===x.ko)continue;if(out.some(o=>BYC[o].ko===y.ko))continue;out.push(c);if(out.length>=n)break}
  return out;
}
function makeQ(x,type){
  if(!type){const t=["read","read","pick","listen"];if(x.s==="k"&&H2K[x.c])t.push("pair","pair");type=pick(t)}
  if(type==="pair"&&!H2K[x.c])type="read";
  let opts,ans;
  if(type==="read"){const d=distract(x,3,true);opts=shuffle([x.c,...d]);ans=x.c}
  else if(type==="pair"){const tgt=BYC[H2K[x.c]];const d=distract(tgt,3,true);opts=shuffle([tgt.c,...d]);ans=tgt.c}
  else{const d=distract(x,3,true);opts=shuffle([x.c,...d]);ans=x.c}
  return{x,type,opts,ans,pick:null};
}
function optLabel(q,c){const y=BYC[c];if(q.type==="read")return `${esc(y.ko)} <small style="opacity:.7">${esc(y.r)}</small>`;return `<span class="ja">${esc(c)}</span>`}

function bindFeed(){

  feed.querySelectorAll(".reel").forEach(r=>io.observe(r));
  requestAnimationFrame(()=>{if(F.jump&&!F.pos){feed.scrollTop=F.jump*feed.clientHeight;F.jump=0}else feed.scrollTop=F.pos||0;updateTop()});
  let st=null;feed.addEventListener("scroll",()=>{clearTimeout(st);st=setTimeout(()=>{F.pos=feed.scrollTop},120)},{passive:true});

  const F=cur(),r=F.reels[idx],key=r.t==="word"?reelItem(r).key:STAGES[r.si].chars[r.i].c;
  if(r.rated===(known?1:0))return;

  if(first)addXP(known?3:1,el);

function answer(idx,i,el){

  else{F.combo=0;r.react=pick(LINES.bad)}

function quizPool(kind){
  const seenAll=ALL.filter(x=>seen(x.c));
  if(kind==="due")return dueList();
  if(kind==="wrong")return wrongList();
  if(kind==="h")return seenAll.filter(x=>x.s==="h");
  if(kind==="k")return seenAll.filter(x=>x.s==="k");
  if(kind==="conf")return seenAll.filter(x=>CONF.some(g=>g.includes(x.c)));
  if(kind==="listen")return seenAll;
  if(kind==="mix")return seenAll;
  if(kind.startsWith("stage:"))return STAGES[+kind.split(":")[1]].chars;
  return seenAll;
}
const QKIND={due:"오늘의 복습",h:"히라가나 퀴즈",k:"가타카나 퀴즈",conf:"헷갈리는 글자",listen:"듣고 고르기",wrong:"오답 격파",mix:"섞어서 퀴즈"};

  tab="quiz";try{history.replaceState(null,"","#quiz")}catch(e){}render();
}

const MARK_A="===== 백업 데이터 시작 (복원용, 수정하지 마세요) =====",MARK_B="===== 백업 데이터 끝 =====";
function buildReport(ph){
  const L=[],boxes=[0,0,0,0,0];ALL.forEach(x=>{const s=ks(x.c);if(s&&s.seen)boxes[s.b||0]++});
  L.push("[일본어 내신 노트 · 학습 리포트]");L.push("학생: "+(S.studentName||"-"));L.push("교재: "+BOOK);L.push("생성일: "+today());
  if(S.exam)L.push(`시험: ${S.examName||"일본어 시험"} ${S.exam} (${ddayTxt()})`);
  L.push("");L.push("■ 요약");
  L.push(`- 레벨: Lv.${lvOf(S.xp)} / 총 ${S.xp} XP`);
  L.push(`- 공부한 날: ${S.studied.length}일 / 현재 연속 ${streak()}일 / 마지막 공부일 ${S.studied.slice().sort().pop()||"-"}`);
  UNIT_NS.forEach(n=>L.push(`- ${n}과: 진도 ${uPct(n)}% (단어 ${uSeenCount(n)}/${UNIT[n].items.length}, 문법 ${uGramSeen(n)}/${UNIT[n].gram.length}, 본문 ${uDlgSeen(n)}/${UNIT[n].chunks.length})`));
  GROUPS.forEach(g=>L.push(`- ${g.n}: ${seenCount(g.f)} / ${ALL.filter(g.f).length}`));
  L.push(`- 장기 기억(3단계 이상): ${masteredCount()} · 복습 단계 분포: ${boxes.map((b,i)=>i+"단계 "+b).join(" · ")}`);
  L.push(`- 오늘 복습 대기: ${dueList().length}개 · 퀴즈 ${S.quizzes||0}판 · 만점 ${S.perfects||0}회 · 최고 콤보 ${S.bestCombo||0}`);
  L.push("");L.push("■ 퀴즈 유형별 정답률");
  Object.keys(QT).forEach(k=>{const t=S.qt[k]||{r:0,w:0},n=t.r+t.w;L.push(`- ${QT[k]}: ${n?Math.round(t.r/n*100)+"%":"-"} (${t.r}/${n})`)});
  L.push("");L.push("■ 행별 진행 (본 글자 / 오답 경험 글자)");
  STAGES.forEach(st=>{const sn2=st.chars.filter(x=>seen(x.c)).length,w=st.chars.filter(x=>ks(x.c)&&ks(x.c).wr>0).map(x=>x.c);L.push(`- ${scriptName(st.s)} ${st.title}: ${sn2}/${st.chars.length}${w.length?" · 헷갈림 "+w.join(""):""}`)});
  L.push("");L.push("■ 최근 14일 (새 글자 · 알아요/다시 · 퀴즈 정답/오답)");
  const days=Object.keys(S.daily).sort().slice(-14);if(!days.length)L.push("- 기록 없음");
  days.forEach(k=>{const d=S.daily[k];L.push(`- ${k}: 새 글자 ${d.v||0} · ${d.k||0}/${d.u||0} · 퀴즈 ${d.qr||0}/${d.qw||0}`)});
  L.push("");const w=wrongList().slice(0,40);L.push(`■ 오답 상위 ${w.length}개 (글자 = 읽기 · 틀린 횟수 · 현재 단계)`);
  w.forEach(x=>L.push(`- ${x.c} = ${x.ko}(${x.r}) · ${ks(x.c).wr}회 · ${ks(x.c).b||0}단계 · ${scriptName(x.s)} ${STAGES[x.si].title}`));
  const uw=uWrong().slice(0,40);L.push("");L.push(`■ 단원 오답 상위 ${uw.length}개 (문장 = 읽기 · 뜻 · 틀린 횟수)`);uw.forEach(k=>L.push(`- ${plainOf(keyLabel(k))} (${kanaOf(keyLabel(k))}) = ${keyMean(k)} · ${S.k[k].wr}회`));
  L.push("");try{L.push(...PhotoNote.reportLines(ph||[]))}catch(e){}
  L.push("");L.push(MARK_A);L.push(JSON.stringify(S));L.push(MARK_B);
  return L.join("\n");
}

let WS={c:null,step:0,tok:0,drawn:0};
function strokeSVG(c){const st=STROKES[c]||[];
  return `<svg viewBox="0 0 109 109" aria-hidden="true"><g class="sg">${st.map(x=>`<path d="${x[0]}"/>`).join("")}</g><g class="sa">${st.map((x,i)=>`<path d="${x[0]}" data-i="${i}"/>`).join("")}</g><g class="sn">${st.map((x,i)=>`<text x="${x[1]}" y="${x[2]}" data-i="${i}">${i+1}</text>`).join("")}</g></svg>`}
function strokeReset(){document.querySelectorAll(".sa path").forEach(p=>{p.getAnimations&&p.getAnimations().forEach(a=>a.cancel());const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.classList.remove("cur")});document.querySelectorAll(".sn text").forEach(t=>t.style.opacity=0);WS.step=0;stepLabel()}
function strokeShow(i,anim){
  const p=document.querySelector(`.sa path[data-i="${i}"]`),t=document.querySelector(`.sn text[data-i="${i}"]`);if(!p)return Promise.resolve();
  document.querySelectorAll(".sa path.cur").forEach(x=>x.classList.remove("cur"));p.classList.add("cur");if(t)t.style.opacity=1;
  const L=p.getTotalLength();
  if(!anim||reduce||!p.animate){p.style.strokeDashoffset=0;return Promise.resolve()}
  return new Promise(res=>{const a=p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:Math.max(380,L*10),easing:"ease-in-out",fill:"forwards"});a.onfinish=()=>{p.style.strokeDashoffset=0;res()}});
}
async function strokePlay(){
  const tok=++WS.tok;strokeReset();const n=(STROKES[WS.c]||[]).length;
  for(let i=0;i<n;i++){if(WS.tok!==tok)return;await strokeShow(i,true);WS.step=i+1;stepLabel();await new Promise(r=>setTimeout(r,200))}
  if(WS.tok===tok)document.querySelectorAll(".sa path.cur").forEach(x=>x.classList.remove("cur"));
}
function strokeStep(){++WS.tok;const n=(STROKES[WS.c]||[]).length;if(WS.step>=n)strokeReset();strokeShow(WS.step,true);WS.step++;stepLabel()}
function stepLabel(){const n=(STROKES[WS.c]||[]).length,b=$("#wStepBtn");if(b)b.textContent=WS.step>=n?"처음부터 한 획씩":`한 획씩 (${WS.step}/${n})`}
function drawnLabel(){const n=(STROKES[WS.c]||[]).length,e=$("#wDrawn");if(e)e.innerHTML=`따라 쓴 획 <b class="num">${WS.drawn}</b> / ${n}`}
function writeChars(str){return [...str].filter(ch=>STROKES[ch])}
function openWrite(c){const x=BYC[c];openWriter({chars:[c],title:`획순 <span class="ja" style="font-size:1.4rem">${c}</span>`,sub:`${esc(x.ko)} · ${esc(x.r)}${x.w!=="-"?` · <span class="ja">${esc(x.w)}</span> ${esc(x.wm)}`:""}`,say:c})}

function startPhoto(){const cs=PhotoNote.dueCards();if(!cs.length){toast("오늘 다시 풀 오답 사진이 없어요");return}
  if(tab==="reels"&&FEED)FEED.pos=($("#feed")||{}).scrollTop||0;
  const reels=cs.map(c=>({t:"photo",id:c.id,ph:c.ph}));reels.push({t:"phend"});
  QF={mode:"quiz",kind:"ph",title:"오답 사진 복습",reels,pos:0,active:0,combo:0,score:0,finished:false};
  tab="quiz";try{history.replaceState(null,"","#quiz")}catch(e){}render()}
function phRedraw(id){if(!QF||QF.kind!=="ph"){render();return}const i=QF.reels.findIndex(r=>r.id===id);if(i<0)return;refreshReel(i);
  const el=document.querySelector(`.reel[data-idx="${i}"] .pn-done`);if(el)nextReel(i,1300)}

(function(){
  const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
  async function keyFromPw(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"])}
  async function openWith(key){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(ENC.iv)},key,b64d(ENC.ct));return (new Function("return ("+new TextDecoder().decode(pt)+")"))()}
  async function savedKey(){try{const r=localStorage.getItem(LOCK.APP_KEY)||localStorage.getItem(LOCK.SHARED_KEY);if(!r)return null;return await crypto.subtle.importKey("raw",b64d(r),{name:"AES-GCM"},true,["decrypt"])}catch(e){return null}}
  function show(msg,bad){
    let el=document.getElementById("lockScreen");
    if(!el){el=document.createElement("div");el.id="lockScreen";document.body.appendChild(el)}
    el.innerHTML=`<div class="lk-card">${LOCK.IMG?`<img class="lk-img" src="${LOCK.IMG}" alt="">`:""}<div class="lk-bubble">${msg||LOCK.HELLO}</div>
      <form id="lkForm"><label for="lkPw">비밀번호</label><input id="lkPw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required class="${bad?"bad":""}"><button id="lkBtn">열기</button></form>
      <p class="lk-note">비밀번호는 보호자에게 받아요.</p></div>`;
    setTimeout(()=>{const i=document.getElementById("lkPw");if(i)i.focus()},100);
  }
  function done(d){DATA=d;const el=document.getElementById("lockScreen");if(el)el.remove();startApp()}
  document.addEventListener("submit",async e=>{if(e.target.id!=="lkForm")return;e.preventDefault();e.stopImmediatePropagation();
    const pw=document.getElementById("lkPw").value,btn=document.getElementById("lkBtn");btn.disabled=true;btn.textContent="여는 중…";
    try{const key=await keyFromPw(pw);const d=await openWith(key);
      try{const raw=b64e(await crypto.subtle.exportKey("raw",key));localStorage.setItem(LOCK.APP_KEY,raw);localStorage.setItem(LOCK.SHARED_KEY,raw)}catch(_){}
      done(d)}
    catch(err){await new Promise(r=>setTimeout(r,600));show("음… 비밀번호가 달라요. 다시 한 번 확인해 줄래?",true)}},true);
  async function boot(){
    if(!ENC){startApp();return} /* 암호화 전 원본(index.src.html)은 바로 연다 */
    if(!window.crypto||!crypto.subtle){show("이 브라우저에서는 열 수 없어요. 아이폰 Safari로 열어 주세요.");return}
    const k=await savedKey();
    if(k){try{return done(await openWith(k))}catch(e){try{localStorage.removeItem(LOCK.APP_KEY)}catch(_){}}show("비밀번호가 바뀌었어. 새 비밀번호를 한 번만 알려 줘.");return}
    show();
  }
  if(document.readyState==="loading")window.addEventListener("DOMContentLoaded",boot);else boot();
})();
